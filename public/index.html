<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Bulk STK Push</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background: #28a745; color: #fff; border: none; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #888; }
    #logs { margin-top: 20px; background: #1e1e1e; color: #fff; padding: 15px; border-radius: 5px; font-family: monospace; max-height: 350px; overflow-y: auto; }
    .log-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #333; }
    .success { color: #2ecc71; }
    .failed { color: #e74c3c; }
  </style>
</head>
<body>
  <h2>Automated Bulk STK Push Dispatcher</h2>
  <form id="stkForm">
    <div class="form-group">
      <label for="phones">Phone Numbers (07... or 254...):</label>
      <textarea id="phones" rows="5" placeholder="0712345678&#10;0787654321" required></textarea>
    </div>
    <div class="form-group">
      <label for="amount">Amount (KES):</label>
      <input type="number" id="amount" placeholder="10" required>
    </div>
    <div class="form-group">
      <label for="reference">Reference Base:</label>
      <input type="text" id="reference" placeholder="ORDER-1001" required>
    </div>
    <button type="submit" id="submitBtn">Fire STK Prompts</button>
  </form>

  <h3>Live Dispatch Status</h3>
  <div id="logs">System ready...</div>

  <script>
    document.getElementById('stkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const logs = document.getElementById('logs');

      const rawPhones = document.getElementById('phones').value;
      const phoneNumbers = rawPhones.split(/[\n,]/).map(p => p.trim()).filter(p => p.length > 0);
      const amount = document.getElementById('amount').value;
      const reference = document.getElementById('reference').value;

      submitBtn.disabled = true;
      logs.innerHTML = '<div>Initiating batch triggers...</div>';

      try {
        const res = await fetch('/api/stk-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumbers, amount, reference })
        });

        const data = await res.json();

        if (!res.ok) {
          logs.innerHTML = `<div class="failed">Error: ${data.message || data.error}</div>`;
        } else {
          logs.innerHTML = '';
          data.results.forEach(item => {
            const statusClass = item.status === 'SUCCESS' ? 'success' : 'failed';
            const logItem = document.createElement('div');
            logItem.className = `log-entry ${statusClass}`;
            
            if (item.status === 'SUCCESS') {
              logItem.innerText = `[STK SENT] Phone: ${item.phone} | Key: ${item.paymentKey} | Msg: ${item.data?.message || 'Prompt dispatched'}`;
            } else {
              logItem.innerText = `[FAILED] Phone: ${item.phone} | Details: ${JSON.stringify(item.error)}`;
            }
            logs.appendChild(logItem);
          });
        }
      } catch (err) {
        logs.innerHTML = `<div class="failed">Client Error: ${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
